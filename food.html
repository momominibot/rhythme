<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ovumind — Food</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  .meal-card {
    background: white;
    border-radius: var(--radius);
    padding: 16px;
    margin: 10px 0;
    box-shadow: var(--shadow);
  }
  .meal-card h4 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .food-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    margin: 2px;
  }
  .tag-warm { background: #fde8d4; color: #b87333; }
  .tag-cool { background: #d4e8f0; color: #3a7a9b; }
  .tag-neutral { background: #e8e0d4; color: #7a6a4a; }
  .add-food {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .add-food input { flex: 1; }
  .balance-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: conic-gradient(var(--sage) 0% 70%, var(--line) 70% 100%);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto;
  }
  .balance-ring::before {
    content: '';
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: white;
  }
  .balance-ring span {
    position: relative;
    z-index: 1;
    font-size: 18px;
    font-weight: 700;
    color: var(--mauve);
  }
  .food-suggestion {
    background: var(--lavender);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin: 6px 0;
    font-size: 13px;
    color: var(--mauve);
  }
</style>
</head>
<body>
<div class="app">
  <div class="orb orb-1"></div>

  <div class="header">
    <span class="brand">OVUMIND</span>
    <span class="material-symbols-outlined" style="color:var(--mauve)">restaurant</span>
  </div>

  <div class="scroll" style="padding: 0 20px;">
    <h2 style="font-size:24px;margin-bottom:4px">Food journal</h2>
    <p class="muted" style="font-size:14px;margin-bottom:12px" id="todayDate"></p>

    <div class="card" style="display:flex;align-items:center;gap:16px">
      <div class="balance-ring"><span id="balanceScore">--</span></div>
      <div>
        <h3 style="margin:0">Today's balance</h3>
        <p class="muted" style="font-size:13px;margin:4px 0 0" id="balanceText">Log meals to see your balance</p>
      </div>
    </div>

    <div id="meals"></div>

    <div class="card">
      <h3>For your phase</h3>
      <div id="phaseFoods"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
const { Store, Cycle } = window.Ovumind;
const today = new Date().toISOString().slice(0, 10);
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

const foodDB = {
  'salmon': { tag: 'warm', phase: ['luteal', 'menstrual'], note: 'Omega-3s for cramps and mood' },
  'oats': { tag: 'warm', phase: ['menstrual', 'follicular'], note: 'Stable energy, gentle on digestion' },
  'leafy greens': { tag: 'cool', phase: ['follicular', 'ovulation'], note: 'Iron and folate' },
  'berries': { tag: 'cool', phase: ['follicular', 'ovulation'], note: 'Antioxidants for skin and energy' },
  'sweet potato': { tag: 'warm', phase: ['luteal'], note: 'Complex carbs for PMS cravings' },
  'ginger tea': { tag: 'warm', phase: ['menstrual'], note: 'Eases cramps and nausea' },
  'chamomile': { tag: 'neutral', phase: ['luteal', 'menstrual'], note: 'Calms nerves, aids sleep' },
  'eggs': { tag: 'neutral', phase: ['follicular', 'ovulation'], note: 'Protein and choline' },
  'nuts': { tag: 'neutral', phase: ['luteal'], note: 'Healthy fats for hormone production' },
  'yogurt': { tag: 'cool', phase: ['follicular'], note: 'Probiotics for gut health' },
  'dark chocolate': { tag: 'warm', phase: ['luteal'], note: 'Magnesium for cramps and mood' },
  'bone broth': { tag: 'warm', phase: ['menstrual'], note: 'Minerals for recovery' }
};

const phaseFoods = {
  menstrual: ['ginger tea', 'bone broth', 'oats', 'salmon', 'dark chocolate'],
  follicular: ['leafy greens', 'berries', 'eggs', 'yogurt'],
  ovulation: ['leafy greens', 'berries', 'eggs'],
  luteal: ['sweet potato', 'nuts', 'salmon', 'dark chocolate', 'chamomile']
};

function getMeals() {
  return Store.get('food_' + today, { breakfast: [], lunch: [], dinner: [], snacks: [] });
}

function saveMeals(meals) {
  Store.set('food_' + today, meals);
}

function addFood(meal) {
  const input = document.getElementById('input_' + meal);
  const food = input.value.trim().toLowerCase();
  if (!food) return;
  const meals = getMeals();
  meals[meal].push(food);
  saveMeals(meals);
  input.value = '';
  render();
}

function removeFood(meal, idx) {
  const meals = getMeals();
  meals[meal].splice(idx, 1);
  saveMeals(meals);
  render();
}

function render() {
  const meals = getMeals();
  const mealNames = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snacks: 'Snacks' };
  const mealIcons = { breakfast: 'light_mode', lunch: 'wb_sunny', dinner: 'dark_mode', snacks: 'cookie' };

  let html = '';
  for (const [key, name] of Object.entries(mealNames)) {
    html += `<div class="meal-card">
      <h4><span class="material-symbols-outlined" style="font-size:18px;color:var(--terracotta)">${mealIcons[key]}</span>${name}</h4>`;
    if (meals[key].length > 0) {
      meals[key].forEach((f, i) => {
        const info = foodDB[f] || { tag: 'neutral' };
        html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0">
          <span class="food-tag tag-${info.tag}">${f}</span>
          <span onclick="removeFood('${key}',${i})" style="cursor:pointer;color:#ccc;font-size:18px">&times;</span>
        </div>`;
      });
    } else {
      html += `<p class="muted" style="font-size:13px">Nothing logged yet</p>`;
    }
    html += `<div class="add-food">
      <input type="text" id="input_${key}" placeholder="Add food..." onkeydown="if(event.key==='Enter')addFood('${key}')">
      <button class="btn btn-soft" style="padding:10px 16px" onclick="addFood('${key}')">Add</button>
    </div></div>`;
  }
  document.getElementById('meals').innerHTML = html;

  // Balance score
  const allFoods = [...meals.breakfast, ...meals.lunch, ...meals.dinner, ...meals.snacks];
  if (allFoods.length > 0) {
    const warm = allFoods.filter(f => (foodDB[f] || {}).tag === 'warm').length;
    const cool = allFoods.filter(f => (foodDB[f] || {}).tag === 'cool').length;
    const score = Math.min(100, Math.round(50 + (warm - cool) * 5 + allFoods.length * 3));
    document.getElementById('balanceScore').textContent = score;
    document.getElementById('balanceText').textContent = score > 65 ? 'Looking balanced' : 'Could use more variety';
  }

  // Phase suggestions
  const phase = Cycle.getPhase(new Date());
  const suggestions = phaseFoods[phase] || phaseFoods.follicular;
  document.getElementById('phaseFoods').innerHTML = suggestions.map(f => {
    const info = foodDB[f];
    return `<div class="food-suggestion"><b>${f}</b> — ${info.note}</div>`;
  }).join('');
}

if (!Store.has('onboarding_complete')) {
  location.href = 'onboarding.html';
} else {
  render();
}
</script>
</body>
</html>
