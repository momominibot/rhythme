<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Room — Ovumind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@400;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Manrope',system-ui,sans-serif;background:#1a1428}
  #canvas-container{position:fixed;inset:0;z-index:1}
  canvas{display:block}
  .ui-overlay{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;pointer-events:auto;background:linear-gradient(180deg,rgba(26,20,40,.8),transparent)}
  .back-btn{background:rgba(255,255,255,.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);color:#f0e8f5;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
  .room-title{text-align:center}
  .room-title h1{font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:#f5edfa}
  .room-title p{font-size:10px;color:rgba(245,237,250,.55);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
  .top-actions{display:flex;gap:8px}
  .icon-btn{background:rgba(255,255,255,.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);color:#f0e8f5;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
  .icon-btn:active{transform:scale(.9)}
  .icon-btn .ms{font-size:20px}
  .catalog{pointer-events:auto;padding:0 12px calc(env(safe-area-inset-bottom) + 12px)}
  .catalog-card{background:rgba(26,20,40,.88);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.1);border-radius:24px 24px 20px 20px;overflow:hidden;max-width:460px;margin:0 auto}
  .catalog-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:8px auto 0}
  .catalog-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px}
  .catalog-header h3{font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:#f5edfa}
  .catalog-tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
  .catalog-tabs::-webkit-scrollbar{display:none}
  .cat-tab{flex-shrink:0;padding:6px 14px;border-radius:99px;font:700 11px 'Manrope',sans-serif;cursor:pointer;transition:.2s;background:rgba(255,255,255,.06);color:rgba(245,237,250,.6);border:1px solid transparent}
  .cat-tab.active{background:rgba(122,92,150,.3);color:#f5edfa;border-color:rgba(196,181,224,.3)}
  .catalog-grid{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none}
  .catalog-grid::-webkit-scrollbar{display:none}
  .cat-item{flex-shrink:0;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:.2s}
  .cat-item:active{transform:scale(.92);background:rgba(196,181,224,.15)}
  .cat-item .swatch{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .cat-item .label{font:700 9px 'Manrope',sans-serif;color:rgba(245,237,250,.7);text-align:center;line-height:1.2}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(26,20,40,.9);backdrop-filter:blur(20px);border:1px solid rgba(196,181,224,.3);color:#f5edfa;padding:10px 20px;border-radius:99px;font:700 12px 'Manrope',sans-serif;z-index:100;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#1a1428,#0d0a14);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
  .loading.hidden{opacity:0;pointer-events:none}
  .loading-orb{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b5e0,#7a5c96);animation:loadPulse 2s ease-in-out infinite;box-shadow:0 0 50px rgba(196,181,224,.4)}
  @keyframes loadPulse{0%,100%{transform:scale(.8);opacity:.7}50%{transform:scale(1.1);opacity:1}}
  .loading p{margin-top:16px;font-family:'Newsreader',serif;font-size:15px;color:rgba(245,237,250,.7)}
  .hint{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .5s}
  .hint.hidden{opacity:0}
  .hint .ms{font-size:48px;color:rgba(196,181,224,.4)}
  .hint p{font-family:'Newsreader',serif;font-size:18px;color:rgba(245,237,250,.5);margin-top:8px}
  .obj-controls{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 180px);left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20;pointer-events:auto}
  .obj-ctrl-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
  .obj-ctrl-btn:active{transform:scale(.88)}
  .obj-ctrl-btn .ms{font-size:20px}
  .obj-ctrl-btn.delete{background:rgba(196,122,106,.35);border-color:rgba(196,122,106,.5)}
  .obj-controls.hidden{display:none}
  .walk-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:15;transition:opacity .3s}
  .walk-hint.hidden{opacity:0}
  .walk-hint .ms{font-size:56px;color:rgba(196,181,224,.5)}
  .walk-hint p{font-family:'Newsreader',serif;font-size:20px;color:rgba(245,237,250,.7);margin-top:12px}
  .walk-hint .keys{margin-top:16px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .walk-hint .key{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:8px;font:700 12px 'Manrope',sans-serif;color:rgba(245,237,250,.7)}
  .crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);z-index:15;pointer-events:none;transition:opacity .3s}
  .crosshair.hidden{opacity:0}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="loading-orb"></div><p>Building your dream room...</p></div>
<div class="crosshair hidden" id="crosshair"></div>
<div class="walk-hint hidden" id="walkHint">
  <span class="material-symbols-outlined">directions_walk</span>
  <p>Click to walk around</p>
  <div class="keys"><span class="key">W A S D</span><span class="key">Mouse</span><span class="key">ESC to exit</span></div>
</div>
<div id="canvas-container"></div>
<div class="toast" id="toast">Tap an item to place it</div>
<div class="obj-controls hidden" id="objControls">
  <button class="obj-ctrl-btn" id="rotateBtn"><span class="material-symbols-outlined">rotate_right</span></button>
  <button class="obj-ctrl-btn" id="scaleUpBtn"><span class="material-symbols-outlined">add</span></button>
  <button class="obj-ctrl-btn" id="scaleDownBtn"><span class="material-symbols-outlined">remove</span></button>
  <button class="obj-ctrl-btn delete" id="deleteBtn"><span class="material-symbols-outlined">delete</span></button>
</div>
<div class="ui-overlay">
  <div class="top-bar">
    <a href="mindfulness.html" class="back-btn"><span class="material-symbols-outlined">arrow_back</span></a>
    <div class="room-title"><h1>My Dream Room</h1><p>Tap items to decorate</p></div>
    <div class="top-actions">
      <button class="icon-btn" id="walkBtn" title="Walk mode"><span class="material-symbols-outlined">directions_walk</span></button>
      <button class="icon-btn" id="resetBtn"><span class="material-symbols-outlined">restart_alt</span></button>
      <button class="icon-btn" id="saveBtn"><span class="material-symbols-outlined">bookmark</span></button>
    </div>
  </div>
  <div class="hint" id="hint"><span class="material-symbols-outlined">touch_app</span><p>Tap items from the catalog to place them</p></div>
  <div class="catalog">
    <div class="catalog-card">
      <div class="catalog-handle"></div>
      <div class="catalog-header"><h3>Decorate</h3><span style="font:600 10px 'Manrope',sans-serif;color:rgba(245,237,250,.4)" id="objCount">0 items</span></div>
      <div class="catalog-tabs" id="catTabs">
        <div class="cat-tab active" data-cat="all">All</div>
        <div class="cat-tab" data-cat="seating">Seating</div>
        <div class="cat-tab" data-cat="nature">Nature</div>
        <div class="cat-tab" data-cat="light">Light</div>
        <div class="cat-tab" data-cat="crystals">Crystals</div>
        <div class="cat-tab" data-cat="decor">Decor</div>
      </div>
      <div class="catalog-grid" id="catGrid"></div>
    </div>
  </div>
</div>

amethyst:{label:'Amethyst Cluster',cat:'crystals',icon:'🔮',build:()=>{const g=new THREE.Group();const b=new THREE.Mesh(new THREE.DodecahedronGeometry(0.25,0),M(0x6a5a7a,0.8));b.position.y=0.1;b.castShadow=true;g.add(b);const cc=[0x9b7bb0,0xb89dd0,0x7a5c96];for(let i=0;i<6;i++){const h=0.3+Math.random()*0.3;const c=new THREE.Mesh(new THREE.ConeGeometry(0.08+Math.random()*0.05,h,6),M(cc[i%3],0.3,0.3,cc[i%3],0.3));const a=i/6*Math.PI*2,r=0.1+Math.random()*0.1;c.position.set(Math.cos(a)*r,0.2+h/2,Math.sin(a)*r);c.rotation.z=(Math.random()-0.5)*0.3;c.rotation.x=(Math.random()-0.5)*0.3;c.castShadow=true;g.add(c);}const l=new THREE.PointLight(0x9b7bb0,0.5,3);l.position.y=0.4;g.add(l);return g;}},

tea:{label:'Tea Set',cat:'decor',icon:'🍵',build:()=>{const g=new THREE.Group();const p=new THREE.Mesh(new THREE.SphereGeometry(0.2,20,16),M(0xa8c0a0,0.6));p.position.y=0.25;p.castShadow=true;g.add(p);const l=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,0.06,16),M(0x8aaa7a,0.6));l.position.y=0.43;g.add(l);const sp=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.2,8),M(0xa8c0a0,0.6));sp.position.set(0.22,0.28,0);sp.rotation.z=-Math.PI/3;g.add(sp);const h=new THREE.Mesh(new THREE.TorusGeometry(0.1,0.025,8,16,Math.PI),M(0xa8c0a0,0.6));h.position.set(-0.2,0.25,0);h.rotation.y=Math.PI/2;g.add(h);for(let i=0;i<2;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.06,0.1,12),M(0xb8d0b0,0.6));c.position.set(i===0?0.4:-0.4,0.05,0.2);c.castShadow=true;g.add(c);}return g;}},
books:{label:'Book Stack',cat:'decor',icon:'📖',build:()=>{const g=new THREE.Group();const cl=[0x9b7bb0,0xa8c0a0,0xd49a8a];for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.08,0.35),M(cl[i],0.7));b.position.y=0.04+i*0.085;b.rotation.y=(i-1)*0.05;b.castShadow=true;b.receiveShadow=true;g.add(b);const p=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.06,0.32),M(0xf5edfa,0.9));p.position.y=0.04+i*0.085;p.position.x=0.01;g.add(p);}return g;}},
incense:{label:'Incense Holder',cat:'decor',icon:'🪔',build:()=>{const g=new THREE.Group();const d=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.2,0.06,24),M(0xa8c0a0,0.7));d.position.y=0.03;d.castShadow=true;g.add(d);const h=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.08,8),M(0x8aaa7a,0.7));h.position.y=0.1;g.add(h);const s=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.4,6),M(0x8a6a5a,0.8));s.position.y=0.3;s.rotation.z=0.15;g.add(s);for(let i=0;i<3;i++){const sm=new THREE.Mesh(new THREE.SphereGeometry(0.03,8,8),M(0xc4b5e0,0.9,0,0xc4b5e0,0.1));sm.position.set(0.03+i*0.02,0.55+i*0.1,0);g.add(sm);}return g;}},
mirror:{label:'Sun Mirror',cat:'decor',icon:'🪞',build:()=>{const g=new THREE.Group();const fr=new THREE.Mesh(new THREE.TorusGeometry(0.35,0.06,12,32),M(0xc4a060,0.4,0.5));fr.position.y=0.6;fr.castShadow=true;g.add(fr);const gl=new THREE.Mesh(new THREE.CircleGeometry(0.3,32),new THREE.MeshStandardMaterial({color:0xb8cde0,roughness:0.1,metalness:0.8}));gl.position.y=0.6;gl.position.z=0.01;g.add(gl);for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const r=new THREE.Mesh(new THREE.ConeGeometry(0.03,0.12,4),M(0xe5c98a,0.5,0.3));r.position.set(Math.cos(a)*0.45,0.6+Math.sin(a)*0.45,0);r.rotation.z=a-Math.PI/2;g.add(r);}const st=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.08,0.3,8),M(0xc4a060,0.5,0.3));st.position.y=0.15;g.add(st);return g;}},
rug:{label:'Mandala Rug',cat:'decor',icon:'🟣',isRug:true,build:()=>{const g=new THREE.Group();const r=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,0.04,48),M(0x7a5c96,0.9));r.position.y=0.02;r.receiveShadow=true;g.add(r);const p1=new THREE.Mesh(new THREE.RingGeometry(0.5,0.7,48),M(0xc4b5e0,0.8));p1.rotation.x=-Math.PI/2;p1.position.y=0.045;g.add(p1);const p2=new THREE.Mesh(new THREE.RingGeometry(1.0,1.2,48),M(0xd49a8a,0.8));p2.rotation.x=-Math.PI/2;p2.position.y=0.046;g.add(p2);const c=new THREE.Mesh(new THREE.CircleGeometry(0.4,32),M(0xe5c98a,0.8));c.rotation.x=-Math.PI/2;c.position.y=0.047;g.add(c);return g;}},
};
let currentCat='all';
function buildCatalog(){const grid=document.getElementById('catGrid');grid.innerHTML='';const colors={seating:'#9b7bb0',nature:'#a8c0a0',light:'#e5c98a',crystals:'#a8b8d8',decor:'#d49a8a'};Object.entries(F).forEach(([k,o])=>{if(currentCat!=='all'&&o.cat!==currentCat)return;const it=document.createElement('div');it.className='cat-item';it.innerHTML=`<div class="swatch" style="background:${colors[o.cat]}33">${o.icon}</div><div class="label">${o.label}</div>`;it.onclick=()=>placeObject(k);grid.appendChild(it);});}
buildCatalog();
document.querySelectorAll('.cat-tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.cat-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');currentCat=t.dataset.cat;buildCatalog();};});
let placed=[],sel=null;
function placeObject(key){const def=F[key];const obj=def.build();obj.userData={key,scale:1,...def};obj.position.set((Math.random()-0.5)*4,0,(Math.random()-0.5)*4+1);obj.rotation.y=Math.random()*Math.PI*2;scene.add(obj);placed.push(obj);updateCount();showToast('Placed '+def.label);document.getElementById('hint').classList.add('hidden');selectObj(obj);save();}
const rc=new THREE.Raycaster(),pt=new THREE.Vector2();let drag=false;const dp=new THREE.Plane(new THREE.Vector3(0,1,0),0),doff=new THREE.Vector3();
function gp(e){pt.x=(e.clientX/innerWidth)*2-1;pt.y=-(e.clientY/innerHeight)*2+1;}
function onDown(e){gp(e);rc.setFromCamera(pt,camera);const ms=[];placed.forEach(o=>o.traverse(c=>{if(c.isMesh)ms.push(c);}));const hs=rc.intersectObjects(ms);if(hs.length>0){let o=hs[0].object;while(o.parent&&!placed.includes(o))o=o.parent;if(placed.includes(o)){selectObj(o);if(!o.userData.isRug){drag=true;controls.enabled=false;const hp=new THREE.Vector3();rc.ray.intersectPlane(dp,hp);doff.copy(o.position).sub(hp);}return;}}deselect();}
function onMove(e){if(!drag||!sel)return;gp(e);rc.setFromCamera(pt,camera);const hp=new THREE.Vector3();if(rc.ray.intersectPlane(dp,hp)){sel.position.x=Math.max(-RW/2+1,Math.min(RW/2-1,hp.x+doff.x));sel.position.z=Math.max(-RD/2+1,Math.min(RD/2-1,hp.z+doff.z));}}
function onUp(){if(drag){drag=false;controls.enabled=true;save();}}
renderer.domElement.addEventListener('pointerdown',onDown);
renderer.domElement.addEventListener('pointermove',onMove);
renderer.domElement.addEventListener('pointerup',onUp);
function selectObj(o){deselect();sel=o;document.getElementById('objControls').classList.remove('hidden');const r=new THREE.Mesh(new THREE.RingGeometry(0.5,0.58,32),new THREE.MeshBasicMaterial({color:0xc4b5e0,side:THREE.DoubleSide,transparent:true,opacity:0.8}));r.rotation.x=-Math.PI/2;r.position.y=0.02;r.userData.sr=true;o.add(r);}
function deselect(){if(sel){sel.traverse(c=>{if(c.userData.sr)c.removeFromParent();});sel=null;}document.getElementById('objControls').classList.add('hidden');}
document.getElementById('rotateBtn').onclick=()=>{if(sel){sel.rotation.y+=Math.PI/4;save();}};
document.getElementById('scaleUpBtn').onclick=()=>{if(sel){sel.userData.scale=Math.min(sel.userData.scale*1.15,2.5);sel.scale.setScalar(sel.userData.scale);save();}};
document.getElementById('scaleDownBtn').onclick=()=>{if(sel){sel.userData.scale=Math.max(sel.userData.scale*0.87,0.4);sel.scale.setScalar(sel.userData.scale);save();}};
document.getElementById('deleteBtn').onclick=delSel;
function delSel(){if(!sel)return;const i=placed.indexOf(sel);if(i>-1){scene.remove(sel);placed.splice(i,1);sel=null;document.getElementById('objControls').classList.add('hidden');updateCount();showToast('Removed');save();}}
document.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')document.getElementById('rotateBtn').click();if(e.key==='Delete'||e.key==='Backspace')delSel();});
function save(){const d=placed.map(o=>({key:o.userData.key,x:o.position.x,y:o.position.y,z:o.position.z,ry:o.rotation.y,s:o.userData.scale}));localStorage.setItem('ovumind_room_3d',JSON.stringify(d));}
function load(){try{const d=JSON.parse(localStorage.getItem('ovumind_room_3d')||'[]');d.forEach(it=>{if(!F[it.key])return;const o=F[it.key].build();o.userData={key:it.key,scale:it.s||1,...F[it.key]};o.position.set(it.x,it.y||0,it.z);o.rotation.y=it.ry||0;o.scale.setScalar(o.userData.scale);scene.add(o);placed.push(o);});updateCount();if(placed.length>0)document.getElementById('hint').classList.add('hidden');}catch(e){}}
function reset(){placed.forEach(o=>scene.remove(o));placed=[];sel=null;document.getElementById('objControls').classList.add('hidden');updateCount();localStorage.removeItem('ovumind_room_3d');document.getElementById('hint').classList.remove('hidden');showToast('Room reset');}
function updateCount(){document.getElementById('objCount').textContent=placed.length+' items';}
let tt;function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
document.getElementById('saveBtn').onclick=()=>{save();showToast('Room saved');};
document.getElementById('resetBtn').onclick=()=>{if(placed.length>0)reset();};
const pc=80,pg=new THREE.BufferGeometry(),pp=new Float32Array(pc*3);
for(let i=0;i<pc;i++){pp[i*3]=(Math.random()-0.5)*RW*0.8;pp[i*3+1]=Math.random()*RH*0.8;pp[i*3+2]=(Math.random()-0.5)*RD*0.8;}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const parts=new THREE.Points(pg,new THREE.PointsMaterial({size:0.05,color:0xc4b5e0,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(parts);
// ── First-person walk mode ──
let walkMode = false;
const walkVelocity = new THREE.Vector3();
const walkDirection = new THREE.Vector3();
const keys = {};
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const PI_2 = Math.PI / 2;

function onMouseMove(e) {
  if (!walkMode || !document.pointerLockElement) return;
  euler.setFromQuaternion(camera.quaternion);
  euler.y -= e.movementX * 0.002;
  euler.x -= e.movementY * 0.002;
  euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
  camera.quaternion.setFromEuler(euler);
}

function onKeyDown(e) { keys[e.code] = true; }
function onKeyUp(e) { keys[e.code] = false; }

document.addEventListener('mousemove', onMouseMove);
document.addEventListener('keydown', onKeyDown);
document.addEventListener('keyup', onKeyUp);

function enterWalkMode() {
  walkMode = true;
  controls.enabled = false;
  // Position camera at eye level
  camera.position.set(0, 1.6, 4);
  euler.set(0, 0, 0);
  camera.quaternion.setFromEuler(euler);
  document.getElementById('walkHint').classList.remove('hidden');
  document.getElementById('crosshair').classList.remove('hidden');
  deselect();
  renderer.domElement.requestPointerLock();
}

function exitWalkMode() {
  walkMode = false;
  controls.enabled = true;
  if (document.pointerLockElement) document.exitPointerLock();
  document.getElementById('walkHint').classList.add('hidden');
  document.getElementById('crosshair').classList.add('hidden');
  camera.position.set(7, 5, 9);
  controls.target.set(0, 1.2, 0);
}

document.getElementById('walkBtn').onclick = () => {
  if (walkMode) exitWalkMode();
  else enterWalkMode();
};

renderer.domElement.addEventListener('click', () => {
  if (walkMode && !document.pointerLockElement) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  if (walkMode && !document.pointerLockElement) {
    document.getElementById('walkHint').classList.remove('hidden');
  } else if (walkMode) {
    document.getElementById('walkHint').classList.add('hidden');
  }
});

function updateWalk(delta) {
  if (!walkMode) return;
  const speed = 4.0;
  walkVelocity.x -= walkVelocity.x * 10.0 * delta;
  walkVelocity.z -= walkVelocity.z * 10.0 * delta;
  walkDirection.z = Number(keys['KeyW'] || keys['ArrowUp']) - Number(keys['KeyS'] || keys['ArrowDown']);
  walkDirection.x = Number(keys['KeyD'] || keys['ArrowRight']) - Number(keys['KeyA'] || keys['ArrowLeft']);
  walkDirection.normalize();
  if (keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'] || keys['ArrowUp'] || keys['ArrowDown'] || keys['ArrowLeft'] || keys['ArrowRight']) {
    walkVelocity.z -= walkDirection.z * speed * delta * 10;
    walkVelocity.x -= walkDirection.x * speed * delta * 10;
  }
  // Move relative to camera direction
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();
  const right = new THREE.Vector3();
  right.crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
  camera.position.addScaledVector(forward, -walkVelocity.z * delta);
  camera.position.addScaledVector(right, walkVelocity.x * delta);
  // Keep within room bounds
  camera.position.x = Math.max(-RW/2+0.5, Math.min(RW/2-0.5, camera.position.x));
  camera.position.z = Math.max(-RD/2+0.5, Math.min(RD/2-0.5, camera.position.z));
  camera.position.y = 1.6;
}

const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const delta=clock.getDelta();const t=clock.getElapsedTime();placed.forEach(o=>{if(o.userData.flame){o.userData.flame.scale.y=1+Math.sin(t*8+o.position.x)*0.15;o.userData.flame.scale.x=1+Math.cos(t*6+o.position.z)*0.1;}});const pos=parts.geometry.attributes.position;for(let i=0;i<pc;i++)pos.setY(i,pos.getY(i)+Math.sin(t*0.3+i)*0.0008);pos.needsUpdate=true;if(walkMode){updateWalk(delta);}else{controls.update();}renderer.render(scene,camera);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
load();animate();
setTimeout(()=>document.getElementById('loading').classList.add('hidden'),1200);
</script>
</body>
