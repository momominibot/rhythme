<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Room — Ovumind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@400;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#2a1f3d;font-family:'Manrope',sans-serif}
  #canvas-container{position:fixed;inset:0}
  canvas{display:block}
  .top-bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;z-index:10}
  .check-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
  .check-btn:active{transform:scale(.92)}
  .check-btn .ms{font-size:24px}
  .top-actions{display:flex;gap:10px}
  .icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn .ms{font-size:20px}
  .undo-redo{position:fixed;bottom:340px;right:20px;display:flex;gap:10px;z-index:10}
  @media(min-width:768px){.undo-redo{bottom:40px}}
  .sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:24px 24px 0 0;z-index:20;transition:transform .35s cubic-bezier(.32,.72,0,1);max-height:70vh;display:flex;flex-direction:column}
  .sheet.collapsed{transform:translateY(calc(100% - 60px))}
  .sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:10px auto 0;cursor:pointer;flex-shrink:0}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 8px;flex-shrink:0}
  .sheet-title{font-family:'Newsreader',serif;font-size:24px;font-weight:600;color:#2a1f3d}
  .sheet-search{width:36px;height:36px;border-radius:50%;background:#f3eef8;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#7a5c96}
  .sheet-search .ms{font-size:20px}
  .sheet-body{overflow-y:auto;padding:0 20px 24px;flex:1;-webkit-overflow-scrolling:touch}
  .sheet-body::-webkit-scrollbar{width:0}
  .quick-actions{display:flex;gap:8px;margin-bottom:16px}
  .quick-btn{flex:1;padding:10px 8px;border-radius:12px;background:#f7f2fa;border:1px solid #e8dff0;font:600 13px 'Manrope',sans-serif;color:#5a4a70;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:all .15s}
  .quick-btn:active{background:#ede4f5}
  .quick-btn .ms{font-size:16px}
  .cat-label{font:700 13px 'Manrope',sans-serif;color:#9a8ab0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
  .categories::-webkit-scrollbar{height:0}
  .cat-chip{flex-shrink:0;padding:8px 16px;border-radius:20px;background:#f7f2fa;border:1.5px solid transparent;font:600 14px 'Manrope',sans-serif;color:#5a4a70;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
  .cat-chip.active{background:#7a5c96;color:#fff;border-color:#7a5c96}
  .cat-chip .ms{font-size:16px}
  .item-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(min-width:768px){.item-grid{grid-template-columns:repeat(8,1fr)}}
  .item-card{aspect-ratio:1;border-radius:14px;background:#f7f2fa;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
  .item-card:active{transform:scale(.93);background:#ede4f5}
  .item-card .ms{font-size:28px;color:#7a5c96}
  .item-card .item-name{font:600 10px 'Manrope',sans-serif;color:#7a6a90;margin-top:4px;text-align:center;padding:0 4px}
  .obj-controls{position:fixed;bottom:72vh;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:15;transition:opacity .2s}
  .obj-controls.hidden{opacity:0;pointer-events:none}
  .obj-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:none;box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5a4a70;transition:all .15s}
  .obj-btn:active{transform:scale(.9)}
  .obj-btn .ms{font-size:22px}
  .obj-btn.delete{color:#d4707a}
  .walk-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:15;transition:opacity .3s}
  .walk-hint.hidden{opacity:0}
  .walk-hint p{font-family:'Newsreader',serif;font-size:20px;color:rgba(245,237,250,.7);margin-top:12px}
  .walk-hint .keys{margin-top:16px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .walk-hint .key{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:8px;font:700 12px 'Manrope',sans-serif;color:rgba(245,237,250,.7)}
  .crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);z-index:15;pointer-events:none;transition:opacity .3s}
  .crosshair.hidden{opacity:0}
  .joystick{position:fixed;bottom:40px;left:30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);z-index:20;touch-action:none;display:none}
  .joystick.active{display:block}
  .joystick-knob{position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;background:rgba(196,181,224,.5);border:2px solid rgba(255,255,255,.3);transform:translate(-50%,-50%);pointer-events:none}
  .look-zone{position:fixed;top:0;right:0;width:55%;height:100%;z-index:19;touch-action:none;display:none}
  .look-zone.active{display:block}
  .mobile-walk-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:15;display:none}
  .mobile-walk-hint.active{display:block}
  .mobile-walk-hint .ms{font-size:48px;color:rgba(196,181,224,.5)}
  .mobile-walk-hint p{font-family:'Newsreader',serif;font-size:17px;color:rgba(245,237,250,.7);margin-top:8px}
  @media(hover:none) and (pointer:coarse){.walk-hint{display:none!important}}
  .loading{position:fixed;inset:0;background:#2a1f3d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
  .loading.hidden{opacity:0;pointer-events:none}
  .loading-orb{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8d5f5,#b89fd9,#7a5c96);box-shadow:0 0 40px rgba(184,159,217,.5);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}
  .loading p{font-family:'Newsreader',serif;font-size:18px;color:rgba(245,237,250,.6);margin-top:20px}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div class="top-bar">
  <button class="check-btn" id="checkBtn"><span class="material-symbols-outlined">check</span></button>
  <div class="top-actions">
    <button class="icon-btn" id="walkBtn" title="Walk mode"><span class="material-symbols-outlined">directions_walk</span></button>
    <button class="icon-btn" id="resetBtn"><span class="material-symbols-outlined">restart_alt</span></button>
  </div>
</div>
<div class="undo-redo">
  <button class="icon-btn" id="undoBtn"><span class="material-symbols-outlined">undo</span></button>
  <button class="icon-btn" id="redoBtn"><span class="material-symbols-outlined">redo</span></button>
</div>
<div class="obj-controls hidden" id="objControls">
  <button class="obj-btn" id="rotBtn"><span class="material-symbols-outlined">rotate_right</span></button>
  <button class="obj-btn" id="scaleBtn"><span class="material-symbols-outlined">zoom_in</span></button>
  <button class="obj-btn delete" id="delBtn"><span class="material-symbols-outlined">delete</span></button>
</div>
<div class="sheet" id="sheet">
  <div class="sheet-handle" id="sheetHandle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Thing Library</div>
    <div class="sheet-search"><span class="material-symbols-outlined">search</span></div>
  </div>
  <div class="sheet-body">
    <div class="quick-actions">
      <button class="quick-btn"><span class="material-symbols-outlined">star</span>Favorites</button>
      <button class="quick-btn"><span class="material-symbols-outlined">add</span>New thing</button>
      <button class="quick-btn"><span class="material-symbols-outlined">download</span>Import</button>
    </div>
    <div class="cat-label">Categories</div>
    <div class="categories" id="categories"></div>
    <div class="cat-label" id="gridLabel">All things</div>
    <div class="item-grid" id="itemGrid"></div>
  </div>
</div>
<div class="crosshair hidden" id="crosshair"></div>
<div class="walk-hint hidden" id="walkHint">
  <span class="material-symbols-outlined" style="font-size:56px;color:rgba(196,181,224,.5)">directions_walk</span>
  <p>Click to walk around</p>
  <div class="keys"><span class="key">W A S D</span><span class="key">Mouse</span><span class="key">ESC to exit</span></div>
</div>
<div class="joystick" id="joystick"><div class="joystick-knob" id="joystickKnob"></div></div>
<div class="look-zone" id="lookZone"></div>
<div class="mobile-walk-hint" id="mobileWalkHint">
  <span class="material-symbols-outlined">directions_walk</span>
  <p>Left stick to move, drag right to look</p>
</div>
<div class="loading" id="loading"><div class="loading-orb"></div><p>Building your dream room...</p></div>

</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2; bgCanvas.height = 512;
const bgCtx = bgCanvas.getContext('2d');
const bgGrad = bgCtx.createLinearGradient(0,0,0,512);
bgGrad.addColorStop(0,'#3d2f52');
bgGrad.addColorStop(0.4,'#5a4070');
bgGrad.addColorStop(0.7,'#8a6a9a');
bgGrad.addColorStop(1,'#c4a8d4');
bgCtx.fillStyle = bgGrad;
bgCtx.fillRect(0,0,2,512);
scene.background = new THREE.CanvasTexture(bgCanvas);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(8, 7, 10);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI / 2.1;
controls.update();
scene.add(new THREE.AmbientLight(0xfff0e0, 0.5));
const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
sun.position.set(6, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xd4c4f0, 0.4);
fill.position.set(-5, 4, -5);
scene.add(fill);
const RW = 10, RD = 10, RH = 5;
const floor = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.2, RD), new THREE.MeshStandardMaterial({color:0xf5e6d3, roughness:0.8}));
floor.position.y = -0.1; floor.receiveShadow = true; scene.add(floor);
const backWall = new THREE.Mesh(new THREE.BoxGeometry(RW, RH, 0.2), new THREE.MeshStandardMaterial({color:0xe8c4d4, roughness:0.9}));
backWall.position.set(0, RH/2, -RD/2); backWall.receiveShadow = true; backWall.castShadow = true; scene.add(backWall);
const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, RH, RD), new THREE.MeshStandardMaterial({color:0xf0d0c8, roughness:0.9}));
rightWall.position.set(RW/2, RH/2, 0); rightWall.receiveShadow = true; rightWall.castShadow = true; scene.add(rightWall);
const bbMat = new THREE.MeshStandardMaterial({color:0xd4b8c0, roughness:0.7});
const bbBack = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.15, 0.05), bbMat);
bbBack.position.set(0, 0.08, -RD/2 + 0.12); scene.add(bbBack);
const bbRight = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, RD), bbMat);
bbRight.position.set(RW/2 - 0.12, 0.08, 0); scene.add(bbRight);
const glowCanvas = document.createElement('canvas');
glowCanvas.width = 256; glowCanvas.height = 256;
const gctx = glowCanvas.getContext('2d');
const gg = gctx.createRadialGradient(128,128,0,128,128,128);
gg.addColorStop(0,'rgba(255,200,220,.4)');
gg.addColorStop(1,'rgba(255,200,220,0)');
gctx.fillStyle = gg; gctx.fillRect(0,0,256,256);
const accentGlow = new THREE.Mesh(new THREE.PlaneGeometry(6, 4), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(glowCanvas), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
accentGlow.position.set(0, 2.5, -RD/2 + 0.11); scene.add(accentGlow);
const CATEGORIES = [
  {id:'all', name:'All', icon:'apps'},
  {id:'seating', name:'Seating', icon:'chair'},
  {id:'plants', name:'Plants', icon:'psychiatry'},
  {id:'decor', name:'Decor', icon:'auto_awesome'},
  {id:'lighting', name:'Lighting', icon:'lightbulb'},
];
const ITEMS = [
  {id:'cushion', name:'Cushion', cat:'seating', icon:'circle'},
  {id:'pillow', name:'Pillow', cat:'seating', icon:'rectangle'},
  {id:'plant', name:'Potted Plant', cat:'plants', icon:'local_florist'},
  {id:'tree', name:'Cherry Tree', cat:'plants', icon:'forest'},
  {id:'flowers', name:'Wildflowers', cat:'plants', icon:'local_florist'},
  {id:'candle', name:'Candle', cat:'lighting', icon:'local_fire_department'},
  {id:'lamp', name:'Mushroom Lamp', cat:'lighting', icon:'lamp'},
  {id:'lantern', name:'Star Lantern', cat:'lighting', icon:'star'},
  {id:'moon', name:'Moon Lamp', cat:'lighting', icon:'bedtime'},
  {id:'amethyst', name:'Amethyst', cat:'decor', icon:'diamond'},
  {id:'quartz', name:'Quartz Point', cat:'decor', icon:'diamond'},
  {id:'tea', name:'Tea Set', cat:'decor', icon:'local_cafe'},
  {id:'books', name:'Book Stack', cat:'decor', icon:'menu_book'},
  {id:'incense', name:'Incense', cat:'decor', icon:'deceased'},
  {id:'mirror', name:'Sun Mirror', cat:'decor', icon:'wb_sunny'},
  {id:'rug', name:'Mandala Rug', cat:'decor', icon:'radio_button_checked'},
];
function mat(c, r=0.6) { return new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:0.05}); }
function makeItem(id) {
  const g = new THREE.Group();
  switch(id) {
    case 'cushion': {
      const c = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.75, 0.25, 32), mat(0xd4a5c4, 0.9));
      c.position.y = 0.13; c.castShadow = true; c.receiveShadow = true; g.add(c);
      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.65, 0.05, 32), mat(0xe0b5d0, 0.85));
      top.position.y = 0.28; g.add(top);
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const t=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),mat(0xc495b4));t.position.set(Math.cos(a)*0.72,0.13,Math.sin(a)*0.72);g.add(t);}
      break;
    }
    case 'pillow': {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.15), mat(0xf0e0d0, 0.9));
      p.position.y = 0.2; p.rotation.z = 0.1; p.castShadow = true; g.add(p);
      const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.35, 0.12), mat(0xe8d0c0, 0.9));
      p2.position.set(0.1, 0.25, 0.05); p2.rotation.z = -0.15; p2.castShadow = true; g.add(p2);
      break;
    }
    case 'plant': {
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.3, 16), mat(0xc4956a, 0.8));
      pot.position.y = 0.15; pot.castShadow = true; g.add(pot);
      const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.03, 16), mat(0x4a3525));
      soil.position.y = 0.31; g.add(soil);
      for(let i=0;i<7;i++){const a=i/7*Math.PI*2;const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8),mat(0x7ab87a,0.7));leaf.position.set(Math.cos(a)*0.12,0.45+Math.random()*0.15,Math.sin(a)*0.12);leaf.scale.set(1,1.5,0.5);leaf.rotation.z=Math.cos(a)*0.3;leaf.castShadow=true;g.add(leaf);}
      break;
    }
    case 'tree': {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.1, 0.6, 8), mat(0x8b6f47, 0.9));
      trunk.position.y = 0.3; trunk.castShadow = true; g.add(trunk);
      for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2;const b=Math.random()*Math.PI;const r=0.3+Math.random()*0.2;const bl=new THREE.Mesh(new THREE.SphereGeometry(0.15+Math.random()*0.1,8,8),mat(0xf0b8d0,0.8));bl.position.set(Math.cos(a)*Math.sin(b)*r,0.65+Math.cos(b)*r*0.7,Math.sin(a)*Math.sin(b)*r);bl.castShadow=true;g.add(bl);}
      break;
    }
    case 'flowers': {
      const vase = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.3, 16), mat(0xd4e8f0, 0.3));
      vase.position.y = 0.15; vase.castShadow = true; g.add(vase);
      const colors = [0xf0a8c0, 0xffe0a0, 0xc8a0e8, 0xf0c8a0];
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.35,6),mat(0x7ab87a));stem.position.set(Math.cos(a)*0.04,0.4,Math.sin(a)*0.04);stem.rotation.z=Math.cos(a)*0.2;g.add(stem);const f=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),mat(colors[i%4],0.7));f.position.set(Math.cos(a)*0.08,0.58,Math.sin(a)*0.08);f.castShadow=true;g.add(f);}
      break;
    }
    case 'candle': {
      const c = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.3, 16), mat(0xfaf0e0, 0.5));
      c.position.y = 0.15; c.castShadow = true; g.add(c);
      const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.06,6), mat(0x333));
      wick.position.y = 0.33; g.add(wick);
      const flame = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({color:0xffaa44}));
      flame.position.y = 0.4; flame.scale.set(1, 1.5, 1); g.add(flame);
      const pl = new THREE.PointLight(0xffaa44, 0.8, 4); pl.position.y = 0.4; g.add(pl);
      g.userData.flame = flame; g.userData.flameLight = pl;
      break;
    }
    case 'lamp': {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), mat(0x8b6f47));
      base.position.y = 0.04; g.add(base);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.25, 8), mat(0x8b6f47));
      stem.position.y = 0.2; g.add(stem);
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 8, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color:0xe8a0b0, roughness:0.5, emissive:0xe8a0b0, emissiveIntensity:0.3}));
      cap.position.y = 0.32; cap.castShadow = true; g.add(cap);

      break;
    }
    case 'lantern': {
      const frame = new THREE.Mesh(new THREE.OctahedronGeometry(0.2, 0), new THREE.MeshStandardMaterial({color:0xd4a5c4, roughness:0.3, metalness:0.3, wireframe:true}));
      frame.position.y = 0.4; g.add(frame);
      const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.15, 0), new THREE.MeshStandardMaterial({color:0xffe0f0, emissive:0xffc0e0, emissiveIntensity:0.5, roughness:0.2}));
      core.position.y = 0.4; g.add(core);
      const string = new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.005,0.3,4), mat(0xaaa));
      string.position.y = 0.65; g.add(string);
      const pl = new THREE.PointLight(0xffc0e0, 0.5, 4); pl.position.y = 0.4; g.add(pl);
      break;

let placedItems = [];

function restoreState(state) {

function load() {

renderGrid();
const sheet = document.getElementById('sheet');
document.getElementById('sheetHandle').onclick = () => sheet.classList.toggle('collapsed');

document.getElementById('scaleBtn').onclick = () => { if(selected){ const s = selected.scale.x >= 1.5 ? 0.7 : selected.scale.x + 0.25; selected.scale.setScalar(s); saveState(); } };

document.getElementById('redoBtn').onclick = redo;

function getIntersects(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

let downPos = null;

    let obj = hits[0].object;
    while (obj.parent && !placedItems.includes(obj)) obj = obj.parent;
    if (placedItems.includes(obj)) { select(obj); isDragging = true; controls.enabled = false; }
  } else { deselect(); }

let walkMode = false;

const walkDirection = new THREE.Vector3();

function onMouseMove(e) {

document.getElementById('walkBtn').onclick = () => walkMode ? exitWalkMode() : enterWalkMode();

const joystick = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystickKnob');
const lookZone = document.getElementById('lookZone');
let joyId = null, joyCenter = {x:0,y:0}, lookId = null, lookLast = {x:0,y:0};
joystick.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; joyId = t.identifier; const rect = joystick.getBoundingClientRect(); joyCenter = {x: rect.left + rect.width/2, y: rect.top + rect.height/2}; }, {passive:false});

  for (const t of e.changedTouches) {

    let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
    const dist = Math.sqrt(dx*dx+dy*dy), maxR = 40;
    if (dist > maxR) { dx = dx/dist*maxR; dy = dy/dist*maxR; }
    joystickKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
    keys['KeyW'] = dy < -5; keys['KeyS'] = dy > 5; keys['KeyA'] = dx < -5; keys['KeyD'] = dx > 5;
  }
}, {passive:false});
function endJoy(e) { for (const t of e.changedTouches) { if (t.identifier === joyId) { joyId = null; joystickKnob.style.transform = 'translate(-50%,-50%)'; keys['KeyW']=keys['KeyS']=keys['KeyA']=keys['KeyD']=false; } } }

  const speed = 4.0;

}
