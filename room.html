<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Room — Ovumind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@400;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Manrope',system-ui,sans-serif; background:#1a1428; }
  #canvas-container { position:fixed; inset:0; z-index:1; }
  canvas { display:block; }

  .ui-overlay { position:fixed; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; }

  .top-bar { display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; pointer-events:auto; background:linear-gradient(180deg,rgba(26,20,40,.8),transparent); }
  .back-btn { background:rgba(255,255,255,.1); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.15); color:#f0e8f5; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none; }
  .room-title { text-align:center; }
  .room-title h1 { font-family:'Newsreader',serif; font-size:19px; font-weight:600; color:#f5edfa; }
  .room-title p { font-size:10px; color:rgba(245,237,250,.55); font-weight:600; letter-spacing:.1em; text-transform:uppercase; margin-top:1px; }
  .top-actions { display:flex; gap:8px; }
  .icon-btn { background:rgba(255,255,255,.1); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.15); color:#f0e8f5; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; }
  .icon-btn:active { transform:scale(.9); }
  .icon-btn .ms { font-size:20px; }

  .catalog { pointer-events:auto; padding:0 12px calc(env(safe-area-inset-bottom) + 12px); }
  .catalog-card { background:rgba(26,20,40,.88); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,.1); border-radius:24px 24px 20px 20px; overflow:hidden; max-width:460px; margin:0 auto; }
  .catalog-handle { width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,.2); margin:8px auto 0; }
  .catalog-header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px 8px; }
  .catalog-header h3 { font-family:'Newsreader',serif; font-size:15px; font-weight:600; color:#f5edfa; }
  .catalog-tabs { display:flex; gap:6px; padding:0 16px 10px; overflow-x:auto; scrollbar-width:none; }
  .catalog-tabs::-webkit-scrollbar { display:none; }
  .cat-tab { flex-shrink:0; padding:6px 14px; border-radius:99px; font:700 11px 'Manrope',sans-serif; cursor:pointer; transition:.2s; background:rgba(255,255,255,.06); color:rgba(245,237,250,.6); border:1px solid transparent; }
  .cat-tab.active { background:rgba(122,92,150,.3); color:#f5edfa; border-color:rgba(196,181,224,.3); }
  .catalog-grid { display:flex; gap:8px; padding:0 16px 14px; overflow-x:auto; scrollbar-width:none; }
  .catalog-grid::-webkit-scrollbar { display:none; }
  .cat-item { flex-shrink:0; width:68px; display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); cursor:pointer; transition:.2s; }
  .cat-item:active { transform:scale(.92); background:rgba(196,181,224,.15); }
  .cat-item img { width:44px; height:44px; object-fit:contain; border-radius:8px; }
  .cat-item .label { font:700 9px 'Manrope',sans-serif; color:rgba(245,237,250,.7); text-align:center; line-height:1.2; }

  .toast { position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-10px); background:rgba(26,20,40,.9); backdrop-filter:blur(20px); border:1px solid rgba(196,181,224,.3); color:#f5edfa; padding:10px 20px; border-radius:99px; font:700 12px 'Manrope',sans-serif; z-index:100; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .loading { position:fixed; inset:0; z-index:200; background:linear-gradient(160deg,#1a1428,#0d0a14); display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .8s; }
  .loading.hidden { opacity:0; pointer-events:none; }
  .loading-orb { width:56px; height:56px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#c4b5e0,#7a5c96); animation:loadPulse 2s ease-in-out infinite; box-shadow:0 0 50px rgba(196,181,224,.4); }
  @keyframes loadPulse { 0%,100%{transform:scale(.8);opacity:.7} 50%{transform:scale(1.1);opacity:1} }
  .loading p { margin-top:16px; font-family:'Newsreader',serif; font-size:15px; color:rgba(245,237,250,.7); }

  .hint { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; transition:opacity .5s; }
  .hint.hidden { opacity:0; }
  .hint .ms { font-size:48px; color:rgba(196,181,224,.4); }
  .hint p { font-family:'Newsreader',serif; font-size:18px; color:rgba(245,237,250,.5); margin-top:8px; }

  .obj-controls { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 180px); left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:20; pointer-events:auto; }
  .obj-ctrl-btn { width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.15); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.25); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; }
  .obj-ctrl-btn:active { transform:scale(.88); }
  .obj-ctrl-btn .ms { font-size:20px; }
  .obj-ctrl-btn.delete { background:rgba(196,122,106,.35); border-color:rgba(196,122,106,.5); }
  .obj-controls.hidden { display:none; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-orb"></div>
  <p>Building your dream room...</p>
</div>

<div id="canvas-container"></div>
<div class="toast" id="toast">Tap an item to place it</div>

<div class="obj-controls hidden" id="objControls">
  <button class="obj-ctrl-btn" id="rotateBtn" title="Rotate (R)"><span class="material-symbols-outlined">rotate_right</span></button>
  <button class="obj-ctrl-btn" id="scaleUpBtn" title="Bigger"><span class="material-symbols-outlined">add</span></button>
  <button class="obj-ctrl-btn" id="scaleDownBtn" title="Smaller"><span class="material-symbols-outlined">remove</span></button>
  <button class="obj-ctrl-btn delete" id="deleteBtn" title="Delete"><span class="material-symbols-outlined">delete</span></button>
</div>

<div class="ui-overlay">
  <div class="top-bar">
    <a href="mindfulness.html" class="back-btn"><span class="material-symbols-outlined">arrow_back</span></a>
    <div class="room-title">
      <h1>My Dream Room</h1>
      <p>Tap items to decorate</p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="resetBtn" title="Reset room"><span class="material-symbols-outlined">restart_alt</span></button>
      <button class="icon-btn" id="saveBtn" title="Save"><span class="material-symbols-outlined">bookmark</span></button>
    </div>
  </div>

  <div class="hint" id="hint">
    <span class="material-symbols-outlined">touch_app</span>
    <p>Tap items from the catalog to place them</p>
  </div>

  <div class="catalog">
    <div class="catalog-card">
      <div class="catalog-handle"></div>
      <div class="catalog-header">
        <h3>Decorate</h3>
        <span style="font:600 10px 'Manrope',sans-serif;color:rgba(245,237,250,.4)" id="objCount">0 items</span>
      </div>
      <div class="catalog-tabs" id="catTabs">
        <div class="cat-tab active" data-cat="all">All</div>
        <div class="cat-tab" data-cat="seating">Seating</div>
        <div class="cat-tab" data-cat="nature">Nature</div>
        <div class="cat-tab" data-cat="light">Light</div>
        <div class="cat-tab" data-cat="crystals">Crystals</div>
        <div class="cat-tab" data-cat="decor">Decor</div>
      </div>
      <div class="catalog-grid" id="catGrid"></div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Object definitions with Seedream-generated images ──
const OBJECTS = {
  cushion:  { label:'Meditation Cushion', cat:'seating',  img:'assets/room/cushion.png',  w:1.6, h:1.2, glow:false },
  pillow:   { label:'Floor Pillow',       cat:'seating',  img:'assets/room/pillow.png',   w:1.3, h:1.3, glow:false },
  plant:    { label:'Potted Plant',       cat:'nature',   img:'assets/room/plant.png',    w:1.2, h:1.6, glow:false },
  tree:     { label:'Cherry Bonsai',      cat:'nature',   img:'assets/room/tree.png',     w:1.4, h:1.8, glow:false },
  flowers:  { label:'Wildflowers',        cat:'nature',   img:'assets/room/flowers.png',  w:1.2, h:1.6, glow:false },
  candle:   { label:'Cute Candle',        cat:'light',    img:'assets/room/candle.png',   w:1.0, h:1.3, glow:true,  glowColor:0xf5c6b8 },
  lamp:     { label:'Mushroom Lamp',      cat:'light',    img:'assets/room/lamp.png',     w:1.2, h:1.6, glow:true,  glowColor:0xf5c6b8 },
  lantern:  { label:'Star Lantern',       cat:'light',    img:'assets/room/lantern.png',  w:1.2, h:1.5, glow:true,  glowColor:0xe5c98a },
  moon:     { label:'Moon Lamp',          cat:'light',    img:'assets/room/moon.png',     w:1.2, h:1.2, glow:true,  glowColor:0xe5c98a },
  amethyst: { label:'Amethyst Cluster',   cat:'crystals', img:'assets/room/amethyst.png', w:1.1, h:1.4, glow:true,  glowColor:0x9b7bb0 },
  quartz:   { label:'Quartz Point',       cat:'crystals', img:'assets/room/quartz.png',   w:0.8, h:1.4, glow:true,  glowColor:0xc4b5e0 },
  tea:      { label:'Tea Set',            cat:'decor',    img:'assets/room/tea.png',      w:1.4, h:1.0, glow:false },
  books:    { label:'Book Stack',         cat:'decor',    img:'assets/room/books.png',    w:1.3, h:1.0, glow:false },
  incense:  { label:'Incense Holder',     cat:'decor',    img:'assets/room/incense.png',  w:1.1, h:1.3, glow:false },
  mirror:   { label:'Sun Mirror',         cat:'decor',    img:'assets/room/mirror.png',   w:1.2, h:1.5, glow:false },
  rug:      { label:'Mandala Rug',        cat:'decor',    img:'assets/room/rug.png',      w:2.5, h:2.5, glow:false, isRug:true },
};

// ── Scene ──
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1428, 0.018);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(6, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 1, 0);

// ── Dreamy room environment ──
// Gradient sky
const skyGeo = new THREE.SphereGeometry(50, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    top: { value: new THREE.Color(0x1a1428) },
    mid: { value: new THREE.Color(0x3d2f52) },
    bot: { value: new THREE.Color(0x6b4a5a) }
  },
  vertexShader: `varying vec3 vP; void main(){ vP = (modelMatrix*vec4(position,1.)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP;
    void main(){ float h = normalize(vP).y; vec3 c = h>0. ? mix(mid,top,pow(h,.6)) : mix(mid,bot,pow(-h,.4)); gl_FragColor=vec4(c,1.); }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// Floor
const floorGeo = new THREE.CircleGeometry(9, 64);
const floorMat = new THREE.MeshStandardMaterial({ color:0x2a1f3a, roughness:0.9, metalness:0.05 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// Soft curved wall backdrop
const wallGeo = new THREE.CylinderGeometry(9, 9, 7, 64, 1, true, Math.PI*0.15, Math.PI*0.7);
const wallMat = new THREE.MeshStandardMaterial({ color:0x251d38, roughness:0.95, side:THREE.DoubleSide, transparent:true, opacity:0.6 });
const wall = new THREE.Mesh(wallGeo, wallMat);
wall.position.y = 3.5;
scene.add(wall);

// ── Lighting ──
scene.add(new THREE.AmbientLight(0xc4b5e0, 0.5));
const mainLight = new THREE.DirectionalLight(0xf5c6b8, 1.0);
mainLight.position.set(5, 10, 5);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(2048, 2048);
mainLight.shadow.camera.near = 0.5; mainLight.shadow.camera.far = 30;
mainLight.shadow.camera.left = -10; mainLight.shadow.camera.right = 10;
mainLight.shadow.camera.top = 10; mainLight.shadow.camera.bottom = -10;
scene.add(mainLight);
const fillLight = new THREE.PointLight(0xc4b5e0, 1.2, 18);
fillLight.position.set(-4, 4, -3);
scene.add(fillLight);
const warmLight = new THREE.PointLight(0xf5c6b8, 0.8, 12);
warmLight.position.set(3, 2, 3);
scene.add(warmLight);

// ── Texture loader with white-to-transparent shader ──
const texLoader = new THREE.TextureLoader();
const textureCache = {};

function getTexture(key) {
  if (!textureCache[key]) {
    textureCache[key] = texLoader.load(OBJECTS[key].img);
    textureCache[key].colorSpace = THREE.SRGBColorSpace;
  }
  return textureCache[key];
}

// Custom shader material: renders texture, makes near-white pixels transparent
function makeSpriteMaterial(texture) {
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: texture }, alphaThreshold: { value: 0.92 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `uniform sampler2D map; uniform float alphaThreshold; varying vec2 vUv;
      void main(){
        vec4 c = texture2D(map, vUv);
        float brightness = (c.r + c.g + c.b) / 3.0;
        if (brightness > alphaThreshold) discard;
        gl_FragColor = c;
      }`,
    transparent: true,
    side: THREE.DoubleSide
  });
}

// ── Create billboard object ──
function createObject(key) {
  const def = OBJECTS[key];
  const group = new THREE.Group();
  group.userData = { key, scale: 1, ...def };

  const tex = getTexture(key);

  if (def.isRug) {
    // Rug lies flat on floor
    const geo = new THREE.PlaneGeometry(def.w, def.h);
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = 0.02;
    mesh.receiveShadow = true;
    group.add(mesh);
    group.userData.isRug = true;
  } else {
    // Billboard sprite facing camera
    const geo = new THREE.PlaneGeometry(def.w, def.h);
    const mat = makeSpriteMaterial(tex);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = def.h / 2;
    mesh.castShadow = true;
    group.add(mesh);
    group.userData.mesh = mesh;

    // Shadow blob
    const shadowGeo = new THREE.CircleGeometry(def.w * 0.4, 24);
    const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2 });
    const shadow = new THREE.Mesh(shadowGeo, shadowMat);
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.01;
    group.add(shadow);

    // Glow light
    if (def.glow) {
      const light = new THREE.PointLight(def.glowColor, 0.6, 3);
      light.position.y = def.h * 0.6;
      group.add(light);
    }
  }

  return group;
}

// ── State ──
let placedObjects = [];
let selectedObject = null;
let currentCat = 'all';

// ── Catalog UI ──
function buildCatalog() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  Object.entries(OBJECTS).forEach(([key, obj]) => {
    if (currentCat !== 'all' && obj.cat !== currentCat) return;
    const item = document.createElement('div');
    item.className = 'cat-item';
    item.innerHTML = `<img src="${obj.img}" alt="${obj.label}" loading="lazy"><div class="label">${obj.label}</div>`;
    item.onclick = () => placeObject(key);
    grid.appendChild(item);
  });
}
buildCatalog();

document.querySelectorAll('.cat-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCat = tab.dataset.cat;
    buildCatalog();
  };
});

// ── Place / select / drag ──
function placeObject(key) {
  const obj = createObject(key);
  const angle = Math.random() * Math.PI * 2;
  const radius = 1.5 + Math.random() * 3;
  obj.position.set(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
  obj.rotation.y = Math.random() * Math.PI * 2;
  scene.add(obj);
  placedObjects.push(obj);
  updateObjCount();
  showToast(`Placed ${OBJECTS[key].label}`);
  document.getElementById('hint').classList.add('hidden');
  selectObject(obj);
  saveRoom();
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let isDragging = false;
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const dragOffset = new THREE.Vector3();

function getPointer(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

function onPointerDown(e) {
  getPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const meshes = [];
  placedObjects.forEach(obj => obj.traverse(child => { if (child.isMesh && child.material) meshes.push(child); }));
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj.parent && !placedObjects.includes(obj)) obj = obj.parent;
    if (placedObjects.includes(obj)) {
      selectObject(obj);
      if (!obj.userData.isRug) {
        isDragging = true;
        controls.enabled = false;
        const hp = new THREE.Vector3();
        raycaster.ray.intersectPlane(dragPlane, hp);
        dragOffset.copy(obj.position).sub(hp);
      }
      return;
    }
  }
  deselectObject();
}

function onPointerMove(e) {
  if (!isDragging || !selectedObject) return;
  getPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hp = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(dragPlane, hp)) {
    selectedObject.position.x = hp.x + dragOffset.x;
    selectedObject.position.z = hp.z + dragOffset.z;
    const dist = Math.sqrt(selectedObject.position.x**2 + selectedObject.position.z**2);
    if (dist > 7.5) { selectedObject.position.x *= 7.5/dist; selectedObject.position.z *= 7.5/dist; }
  }
}

function onPointerUp() {
  if (isDragging) { isDragging = false; controls.enabled = true; saveRoom(); }
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerup', onPointerUp);

// ── Selection ──
function selectObject(obj) {
  deselectObject();
  selectedObject = obj;
  document.getElementById('objControls').classList.remove('hidden');
  if (!obj.userData.isRug) {
    const ringGeo = new THREE.RingGeometry(obj.userData.w*0.55, obj.userData.w*0.65, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color:0xc4b5e0, side:THREE.DoubleSide, transparent:true, opacity:0.9 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.03;
    ring.userData.isSelectionRing = true;
    obj.add(ring);
  }
}

function deselectObject() {
  if (selectedObject) {
    selectedObject.traverse(c => { if (c.userData.isSelectionRing) c.removeFromParent(); });
    selectedObject = null;
  }
  document.getElementById('objControls').classList.add('hidden');
}

// ── Object controls ──
document.getElementById('rotateBtn').onclick = () => {
  if (selectedObject) { selectedObject.rotation.y += Math.PI/4; saveRoom(); }
};
document.getElementById('scaleUpBtn').onclick = () => {
  if (selectedObject) { selectedObject.userData.scale = Math.min(selectedObject.userData.scale * 1.15, 2.5); selectedObject.scale.setScalar(selectedObject.userData.scale); saveRoom(); }
};
document.getElementById('scaleDownBtn').onclick = () => {
  if (selectedObject) { selectedObject.userData.scale = Math.max(selectedObject.userData.scale * 0.87, 0.4); selectedObject.scale.setScalar(selectedObject.userData.scale); saveRoom(); }
};
document.getElementById('deleteBtn').onclick = deleteSelected;

function deleteSelected() {
  if (!selectedObject) return;
  const idx = placedObjects.indexOf(selectedObject);
  if (idx > -1) {
    scene.remove(selectedObject);
    placedObjects.splice(idx, 1);
    selectedObject = null;
    document.getElementById('objControls').classList.add('hidden');
    updateObjCount();
    showToast('Removed');
    saveRoom();
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') document.getElementById('rotateBtn').click();
  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
});

// ── Save / Load ──
function saveRoom() {
  const data = placedObjects.map(obj => ({
    key: obj.userData.key,
    x: obj.position.x, y: obj.position.y, z: obj.position.z,
    ry: obj.rotation.y, s: obj.userData.scale
  }));
  localStorage.setItem('ovumind_room_v2', JSON.stringify(data));
}

function loadRoom() {
  try {
    const data = JSON.parse(localStorage.getItem('ovumind_room_v2') || '[]');
    data.forEach(item => {
      if (!OBJECTS[item.key]) return;
      const obj = createObject(item.key);
      obj.position.set(item.x, item.y || 0, item.z);
      obj.rotation.y = item.ry || 0;
      obj.userData.scale = item.s || 1;
      obj.scale.setScalar(obj.userData.scale);
      scene.add(obj);
      placedObjects.push(obj);
    });
    updateObjCount();
    if (placedObjects.length > 0) document.getElementById('hint').classList.add('hidden');
  } catch(e) {}
}

function resetRoom() {
  placedObjects.forEach(obj => scene.remove(obj));
  placedObjects = [];
  selectedObject = null;
  document.getElementById('objControls').classList.add('hidden');
  updateObjCount();
  localStorage.removeItem('ovumind_room_v2');
  document.getElementById('hint').classList.remove('hidden');
  showToast('Room reset');
}

function updateObjCount() {
  document.getElementById('objCount').textContent = placedObjects.length + ' items';
}

// ── Toast ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('saveBtn').onclick = () => { saveRoom(); showToast('Room saved'); };
document.getElementById('resetBtn').onclick = () => { if (placedObjects.length > 0) resetRoom(); };

// ── Floating particles ──
const pCount = 120;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
const pCol = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  pPos[i*3] = (Math.random()-0.5)*16;
  pPos[i*3+1] = Math.random()*7;
  pPos[i*3+2] = (Math.random()-0.5)*16;
  const c = new THREE.Color([0xc4b5e0,0xf5c6b8,0xe5c98a][Math.floor(Math.random()*3)]);
  pCol[i*3]=c.r; pCol[i*3+1]=c.g; pCol[i*3+2]=c.b;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ size:0.06, vertexColors:true, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false }));
scene.add(particles);

// ── Animate ──
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Billboard: make sprites face camera
  placedObjects.forEach((obj, i) => {
    if (obj.userData.mesh && !isDragging) {
      obj.userData.mesh.lookAt(camera.position);
      // Keep upright
      obj.userData.mesh.rotation.x = 0;
      obj.userData.mesh.rotation.z = 0;
    }
    // Gentle float
    if (!obj.userData.isRug && (!isDragging || obj !== selectedObject)) {
      obj.position.y = Math.sin(t * 0.8 + i * 0.5) * 0.04;
    }
  });

  // Particles
  const pos = particles.geometry.attributes.position;
  for (let i = 0; i < pCount; i++) pos.setY(i, pos.getY(i) + Math.sin(t*0.2+i)*0.001);
  pos.needsUpdate = true;
  particles.rotation.y = t * 0.01;

  warmLight.intensity = 0.7 + Math.sin(t*1.5)*0.15;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

loadRoom();
animate();
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 1500);
</script>
