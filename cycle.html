<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ovumind — Cycle</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  .cycle-ring {
    width: 200px; height: 200px;
    border-radius: 50%;
    margin: 20px auto;
    position: relative;
    background: conic-gradient(var(--mauve) 0% 25%, var(--peach) 25% 50%, var(--sage) 50% 75%, var(--lavender) 75% 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .cycle-ring::before {
    content: '';
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    background: var(--paper);
  }
  .cycle-info { position: relative; z-index: 1; text-align: center; }
  .cycle-info .day { font-size: 42px; font-family: var(--font-serif); font-weight: 600; color: var(--mauve); }
  .cycle-info .phase { font-size: 14px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin: 16px 0;
  }
  .cal-grid .dow { text-align: center; font-size: 11px; color: var(--ink-soft); font-weight: 600; padding: 4px 0; }
  .cal-grid .day-cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .day-cell.period { background: var(--rose); color: #9b4a4a; font-weight: 600; }
  .day-cell.fertile { background: var(--peach); color: #9b6a4a; }
  .day-cell.today { border: 2px solid var(--mauve); font-weight: 700; }
  .day-cell.other { color: #ccc; }
  .stat-box { text-align: center; padding: 12px; }
  .stat-box .num { font-size: 28px; font-family: var(--font-serif); font-weight: 600; color: var(--mauve); }
  .stat-box .label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }
  .log-btn {
    width: 100%;
    padding: 16px;
    border-radius: var(--radius);
    border: 2px dashed var(--mauve-light);
    background: var(--lavender);
    color: var(--mauve);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-sans);
    margin: 12px 0;
  }
</style>
</head>
<body>
<div class="app">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="header">
    <span class="brand">OVUMIND</span>
    <span class="material-symbols-outlined" style="color:var(--mauve)">calendar_month</span>
  </div>

  <div class="scroll" style="padding: 0 20px;">
    <h2 style="font-size:24px;margin-bottom:4px">Your cycle</h2>
    <p class="muted" style="font-size:14px;margin-bottom:8px">Tracking gently, no pressure.</p>

    <div class="cycle-ring">
      <div class="cycle-info">
        <div class="day" id="cycleDay">--</div>
        <div class="phase" id="cyclePhase">Set your period</div>
      </div>
    </div>

    <div class="grid-2" style="margin: 16px 0;">
      <div class="card stat-box" style="margin:0">
        <div class="num" id="nextPeriod">--</div>
        <div class="label">Days until next period</div>
      </div>
      <div class="card stat-box" style="margin:0">
        <div class="num" id="ovulation">--</div>
        <div class="label">Days until ovulation</div>
      </div>
    </div>

    <button class="log-btn" onclick="logPeriod()">
      <span class="material-symbols-outlined" style="vertical-align:middle;font-size:18px">water_drop</span>
      Log my period today
    </button>

    <div class="card">
      <h3>This month</h3>
      <div class="cal-grid" id="calendar"></div>
      <div style="display:flex;gap:16px;font-size:11px;color:var(--ink-soft);margin-top:8px">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rose);margin-right:4px"></span>Period</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--peach);margin-right:4px"></span>Fertile</span>
      </div>
    </div>

    <div class="card">
      <h3>How you might feel</h3>
      <p id="phaseInfo">Log your period to see phase-based insights.</p>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
const { Store, Cycle } = window.Ovumind;
const phaseNames = { menstrual: 'Menstrual', follicular: 'Follicular', ovulation: 'Ovulation', luteal: 'Luteal', unknown: 'Unknown' };
const phaseTips = {
  menstrual: 'Rest and nourish. Your body is shedding. Warm foods, gentle movement, and extra sleep go a long way.',
  follicular: 'Energy is rising. This is a great time for new projects, harder workouts, and social connection.',
  ovulation: 'Peak energy and confidence. Your communication skills shine. Schedule important conversations now.',
  luteal: 'Energy may dip. Prioritize comfort, reduce caffeine, and be gentle with yourself. PMS is real.'
};

function render() {
  const today = new Date();
  const phase = Cycle.getPhase(today);
  const last = Cycle.getLastPeriod();

  if (last) {
    const day = Math.floor((today - last) / 86400000) + 1;
    document.getElementById('cycleDay').textContent = 'Day ' + day;
    document.getElementById('cyclePhase').textContent = phaseNames[phase];

    const nextP = Cycle.daysUntil(Cycle.getNextPeriod());
    const ov = Cycle.daysUntil(Cycle.getOvulationDay());
    document.getElementById('nextPeriod').textContent = nextP !== null ? nextP : '--';
    document.getElementById('ovulation').textContent = ov !== null && ov > 0 ? ov : 'now';
    document.getElementById('phaseInfo').textContent = phaseTips[phase] || '';
  }

  renderCalendar();
}

function renderCalendar() {
  const cal = document.getElementById('calendar');
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const last = Cycle.getLastPeriod();
  const cycleLen = Cycle.getCycleLength();
  const periodLen = Cycle.getPeriodLength();

  const dows = ['S','M','T','W','T','F','S'];
  let html = dows.map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += '<div></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    let cls = 'day-cell';
    if (last) {
      const diff = Math.floor((date - last) / 86400000);
      const cycleDay = diff % cycleLen;
      if (cycleDay >= 0 && cycleDay < periodLen) cls += ' period';
      else if (cycleDay >= cycleLen - 16 && cycleDay <= cycleLen - 12) cls += ' fertile';
    }
    if (d === today.getDate()) cls += ' today';
    html += `<div class="${cls}" onclick="pickDay(${d})">${d}</div>`;
  }
  cal.innerHTML = html;
}

function pickDay(d) {
  // Could add symptom logging here
}

function logPeriod() {
  const today = new Date().toISOString().slice(0, 10);
  Store.set('last_period', today);
  render();
}

// Check onboarding
if (!Store.has('onboarding_complete')) {
  location.href = 'onboarding.html';
} else {
  render();
}
</script>
</body>
</html>
