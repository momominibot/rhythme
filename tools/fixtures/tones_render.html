<!doctype html>
<meta charset="utf-8">
<title>Rhythme tones render fixture</title>
<p>Renders a version of ovu-tones.js into an OfflineAudioContext for tools/tones_render.py and measures it. Nothing plays here.</p>
<script>
/* Load a module source into a fake root whose AudioContext returns the offline context (lesson of 20 Oct), start one pitch or
   bed, Stop it at stopAt through OfflineAudioContext.suspend, render, and measure the steady part and both ends. */

window.kCoeffs = kCoeffs;

/* a 4x true-peak estimate: windowed-sinc interpolation (12 taps) at the three points between samples, over a range */

  var T = root.OvuTones; if (!T) throw new Error('module did not export OvuTones');

    if (step.op === 'volume') { vol = step.arg; return T.setVolume(); } if (step.op === 'off') { on = false; T.stop(); return T.hush && T.hush(); } if (step.op === 'on') { on = true; return; }

  var s0 = Math.round((opts.steadyFrom || 10) * sr), s1 = Math.round(stopAt * sr), stopEnd = Math.min(n, Math.round((stopAt + 6) * sr));

  var sl = 0, srr = 0, sm = 0; for (var i = s0; i < s1; i++) { sl += L[i] * L[i]; srr += R[i] * R[i]; var m = (L[i] + R[i]) / 2; sm += m * m; }
  var kw = kMeanSquare(L, sr, s0, s1) + kMeanSquare(R, sr, s0, s1);
  /* spectrum of the mono average over the steady part: Hann windows of 8192, averaged power; centroid and the share above 2 kHz */
  var N = 8192, re = new Float64Array(N), im = new Float64Array(N), pow = new Float64Array(N / 2), wins = 0;
  for (var st = s0; st + N <= s1; st += N) { for (var q = 0; q < N; q++) { var w = 0.5 - 0.5 * Math.cos(2 * Math.PI * q / (N - 1)); re[q] = w * (L[st + q] + R[st + q]) / 2; im[q] = 0; } fft(re, im); for (var b = 0; b < N / 2; b++) pow[b] += re[b] * re[b] + im[b] * im[b]; wins++; }
  var num = 0, den = 0, hi = 0, peakBin = 0, peakVal = 0;
  for (var b2 = 1; b2 < N / 2; b2++) { var f = b2 * sr / N; num += f * pow[b2]; den += pow[b2]; if (f >= 2000) hi += pow[b2]; if (pow[b2] > peakVal) { peakVal = pow[b2]; peakBin = b2; } }

     against a swell (0.05 to 1.5 Hz) */

  for (var e = s0; e + win <= s1; e += hop) { var acc2 = 0; for (var k2 = e; k2 < e + win; k2++) { var mm = (L[k2] + R[k2]) / 2; acc2 += mm * mm; } env.push(Math.sqrt(acc2 / win)); }
  var emax = Math.max.apply(null, env), emin = Math.min.apply(null, env), mean = env.reduce(function (a, b) { return a + b; }, 0) / env.length;
  var M = 1; while (M < env.length) M <<= 1; var er = new Float64Array(M), ei = new Float64Array(M);
  for (var z = 0; z < env.length; z++) er[z] = env[z] - mean;

  for (var q2 = 0; q2 < head; q2++) { pcm[q2 * 2] = Math.max(-32768, Math.min(32767, Math.round(L[q2] * 32767))); pcm[q2 * 2 + 1] = Math.max(-32768, Math.min(32767, Math.round(R[q2] * 32767))); }

    sampleRate: sr, seconds: secs, stopAt: stopAt, steady: [s0 / sr, s1 / sr], gainFor: T.gainFor(opts.volume == null ? 0.25 : opts.volume), live: T.liveNodes ? T.liveNodes() : null,

</script>
