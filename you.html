<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ovumind — You</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  .profile-avatar {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--mauve-light), var(--peach));
    margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-row .label { font-size: 15px; font-weight: 500; }
  .setting-row .value { font-size: 14px; color: var(--ink-soft); }
  .stat-card {
    text-align: center;
    padding: 16px 8px;
  }
  .stat-card .num { font-size: 28px; font-family: var(--font-serif); font-weight: 600; color: var(--mauve); }
  .stat-card .lbl { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="app">
  <div class="orb orb-1"></div>

  <div class="header">
    <span class="brand">OVUMIND</span>
    <span class="material-symbols-outlined" style="color:var(--mauve)">person</span>
  </div>

  <div class="scroll" style="padding: 0 20px;">
    <div class="text-center" style="margin: 16px 0 24px">
      <div class="profile-avatar">&#9792;</div>
      <h2 style="font-size:22px">Your space</h2>
      <p class="muted" style="font-size:14px" id="memberSince"></p>
    </div>

    <div class="grid-2" style="margin-bottom:16px">
      <div class="card stat-card" style="margin:0">
        <div class="num" id="daysTracked">0</div>
        <div class="lbl">Days with you</div>
      </div>
      <div class="card stat-card" style="margin:0">
        <div class="num" id="mealsLogged">0</div>
        <div class="lbl">Meals logged</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:8px">Your cycle</h3>
      <div class="setting-row">
        <span class="label">Cycle length</span>
        <span class="value" id="cycleLen">28 days</span>
      </div>
      <div class="setting-row">
        <span class="label">Period length</span>
        <span class="value" id="periodLen">5 days</span>
      </div>
      <div class="setting-row">
        <span class="label">Last period</span>
        <span class="value" id="lastPeriod">Not set</span>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:8px">Preferences</h3>
      <div class="setting-row">
        <span class="label">Reminders</span>
        <span class="value">Off</span>
      </div>
      <div class="setting-row">
        <span class="label">Erin's voice</span>
        <span class="value" id="voiceStatus">Available</span>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:8px">Data</h3>
      <div class="setting-row" onclick="exportData()" style="cursor:pointer">
        <span class="label">Export my data</span>
        <span class="material-symbols-outlined" style="color:var(--ink-soft);font-size:18px">chevron_right</span>
      </div>
      <div class="setting-row" onclick="resetData()" style="cursor:pointer">
        <span class="label" style="color:#c44">Reset everything</span>
        <span class="material-symbols-outlined" style="color:#c44;font-size:18px">chevron_right</span>
      </div>
    </div>

    <p class="text-center muted" style="font-size:12px;margin-top:24px">Ovumind v1.0 · Made with care</p>
  </div>
</div>

<script src="app.js"></script>
<script>
const { Store, Cycle } = window.Ovumind;

function render() {
  const onboarding = Store.get('onboarding', {});
  const startDate = Store.get('start_date', new Date().toISOString());
  const days = Math.max(1, Math.floor((new Date() - new Date(startDate)) / 86400000) + 1);
  document.getElementById('daysTracked').textContent = days;

  // Count meals
  let mealCount = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = 'food_' + d.toISOString().slice(0, 10);
    const meals = Store.get(key, null);
    if (meals) mealCount += Object.values(meals).flat().length;
  }
  document.getElementById('mealsLogged').textContent = mealCount;

  document.getElementById('cycleLen').textContent = Cycle.getCycleLength() + ' days';
  document.getElementById('periodLen').textContent = Cycle.getPeriodLength() + ' days';
  const last = Cycle.getLastPeriod();
  document.getElementById('lastPeriod').textContent = last ? last.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'Not set';
  document.getElementById('memberSince').textContent = 'Since ' + new Date(startDate).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('ovumind_')) data[key] = localStorage.getItem(key);
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ovumind-data.json'; a.click();
}

function resetData() {
  if (confirm('This will erase all your data. Continue?')) {
    Object.keys(localStorage).filter(k => k.startsWith('ovumind_')).forEach(k => localStorage.removeItem(k));
    location.href = 'onboarding.html';
  }
}

if (!Store.has('onboarding_complete')) {
  location.href = 'onboarding.html';
} else {
  if (!Store.has('start_date')) Store.set('start_date', new Date().toISOString());
  render();
}
</script>
</body>
</html>
