<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f3fb">
<title>Rhythme · Evidence</title>
<link rel="icon" type="image/png" href="assets/onboarding/luna.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@400;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="ovu-pages.css">
<style>
  .evsearch{position:relative;margin-top:2px}
  .evsearch .ms{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--rm-ink-3);font-size:20px}
  .evsearch .input{padding-left:40px}
  .evgroup h2{font-size:16px}
  .evitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:11px 0;border-top:1px dashed rgba(107,82,142,.15);scroll-margin-top:90px}
  .evitem:first-of-type{border-top:none}
  .evitem .num{font:800 11px var(--sans);letter-spacing:.03em;background:var(--rm-lilac-2);color:var(--rm-mauve);border-radius:999px;padding:4px 8px;min-width:40px;text-align:center}
  .evitem b{display:block;font:800 13.5px/1.3 var(--sans);color:var(--rm-plum)}
  .evitem p{font:600 12.5px/1.5 var(--sans);color:var(--rm-ink-2);margin-top:3px}
  .evitem a{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font:800 12px var(--sans);color:var(--rm-mauve);text-decoration:none;overflow-wrap:anywhere}
  .evitem a .ms{font-size:16px}
  .evitem.hit{background:linear-gradient(90deg,rgba(246,201,214,.35),rgba(255,255,255,0));border-radius:14px;padding-left:8px;padding-right:8px}
  .evempty{font:600 13px var(--sans);color:var(--rm-ink-3);text-align:center;padding:18px 0}
  @media (min-width:760px){.app{max-width:760px}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <a class="back" href="room.html" aria-label="Back to your room"><span class="ms">arrow_back</span></a>
    <h1>Evidence<small>Every source behind the guides, by number</small></h1>
  </header>
  <div class="stack">
    <section class="card hero">
      <p class="sub" style="margin-top:0">Guides in your room show a short citation such as <b>NICE NG88, 2018 · E5</b>. Search the number or a word to read the full note and open the source.</p>
      <div class="evsearch field"><span class="ms">search</span><input class="input" id="q" type="search" placeholder="E5, NHS, sleep…" aria-label="Search the evidence" autocomplete="off"></div>
    </section>
    <div id="list" class="stack"></div>
    <p class="sub" style="text-align:center;padding:4px 10px 0">Guidance, not a diagnosis. Bring the pattern to a clinician you trust.</p>
  </div>
</main>
<script src="ovu-evidence.js"></script>
<script>
(function () {
  'use strict';
  var focus = '', E = window.OvuEvidence, list = document.getElementById('list'), q = document.getElementById('q');
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return 'source'; } }
  function item(e, hit) {
    return '<div class="evitem' + (hit ? ' hit' : '') + '" id="' + e.id + '"><span class="num">' + e.id + '</span><div><b>' + esc(e.short) + '</b><p>' + esc(e.text) + '</p><a href="' + esc(e.url) + '" target="_blank" rel="noopener"><span class="ms">open_in_new</span>' + esc(host(e.url)) + '</a></div></div>';
  }
  function render() {
    var t = q.value.trim().toLowerCase(), byNum = /^e?\d+$/.test(t) ? 'E' + t.replace(/^e/, '') : '';
    var match = function (e) { return !t || (byNum ? e.id === byNum : (e.id + ' ' + e.short + ' ' + e.text + ' ' + e.topics.map(function (k) { return E.TOPICS[k]; }).join(' ')).toLowerCase().indexOf(t) > -1); };
    var html = Object.keys(E.TOPICS).map(function (k) {
      var rows = E.forTopic(k).filter(match); if (!rows.length) return '';
      return '<section class="card evgroup"><h2><span class="ms">menu_book</span>' + esc(E.TOPICS[k]) + '</h2>' + rows.map(function (e) { return item(e, (byNum && e.id === byNum) || (!t && e.id === focus)); }).join('') + '</section>';
    }).join('');
    list.innerHTML = html || '<div class="card evempty">Nothing matches that yet.</div>';
  }
  q.addEventListener('input', render);
  var h = (location.hash || '').replace('#', '');
  if (/^E\d+$/.test(h)) focus = h;
  render();
  if (focus) { var el = document.getElementById(focus); if (el) setTimeout(function () { el.scrollIntoView({ block: 'start' }); }, 60); }
})();
</script>
</body>
</html>
